<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bunny Viewer Extension</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: transparent;
            font-family: Arial, sans-serif;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        .floor {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            /* border-top: 2px solid rgba(100, 160, 60, 0.5); */
        }
        .bunny {
            position: absolute;
            width: 60px;
            height: 60px;
            background-repeat: no-repeat;
            background-size: contain;
            background-position: center bottom;
            bottom: 0;
            transform-origin: bottom center;
            image-rendering: pixelated;
        }
        .bunny-name {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 14px;
            text-shadow: 0 0 3px #000, 0 0 3px #000;
            text-align: center;
        }
        .streamer-bunny, .mod-bunny, .vip-bunny {
            width: 60px;
            height: 60px;
        }
        .bunny-hopping {
            animation: hop 0.5s ease-out forwards !important;
        }
        @keyframes hop {
            0% { transform: translateY(0) scaleY(1); }
            50% { transform: translateY(-30px) scaleY(1.1); }
            100% { transform: translateY(0) scaleY(1); }
        }
        .bunny[style*="scaleX(-1)"].bunny-hopping {
            animation: hop-left 0.5s ease-out forwards !important;
        }
        @keyframes hop-left {
            0% { transform: translateY(0) scaleX(-1) scaleY(1); }
            50% { transform: translateY(-30px) scaleX(-1) scaleY(1.1); }
            100% { transform: translateY(0) scaleX(-1) scaleY(1); }
        }
        #config-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            z-index: 100;
            width: 350px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
        #config-overlay h3 {
            margin-top: 0;
            color: #9147ff;
        }
        #config-overlay input, #config-overlay button {
            margin: 8px 0;
            padding: 10px;
            width: 100%;
            border: none;
            border-radius: 4px;
            box-sizing: border-box;
        }
        #config-overlay button {
            background-color: #9147ff;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        #config-overlay button:hover {
            background-color: #772ce8;
        }
        .hidden {
            display: none;
        }
        .status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
            font-size: 14px;
        }
        .status-error {
            background-color: rgba(255, 80, 80, 0.3);
            border: 1px solid rgba(255, 80, 80, 0.5);
        }
        .status-success {
            background-color: rgba(80, 255, 80, 0.3);
            border: 1px solid rgba(80, 255, 80, 0.5);
        }
        .status-loading {
            background-color: rgba(80, 80, 255, 0.3);
            border: 1px solid rgba(80, 80, 255, 0.5);
        }
        .section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }
        .tabs {
            display: flex;
            margin-bottom: 15px;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 8px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }
        .tab.active {
            border-bottom: 2px solid #9147ff;
            font-weight: bold;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        #token-display {
            word-break: break-all;
            background-color: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            max-height: 80px;
            overflow-y: auto;
        }
        .hint {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div id="config-overlay">
        <h3>Bunny Viewer Configuration</h3>
        
        <div class="tabs">
            <div class="tab active" data-tab="config">Configuration</div>
            <div class="tab" data-tab="auth">Authentication</div>
        </div>
        
        <div class="tab-content active" id="config-tab">
            <input type="text" id="channel-name" placeholder="Your Twitch Channel Name">
            <input type="text" id="client-id" placeholder="Twitch Client ID">
            <div class="hint">Your Client ID from the Twitch Developer Console</div>
            <div id="token-status-display" class="status hidden"></div>
            <button id="save-config">Save & Start</button>
            <div id="status-message" class="status hidden"></div>
        </div>
        
        <div class="tab-content" id="auth-tab">
            <input type="text" id="auth-client-id" placeholder="Your Twitch Client ID">
            <div class="hint">Your Client ID from the Twitch Developer Console</div>
            <input type="text" id="redirect-uri" placeholder="Redirect URI" value="">
            <div class="hint">Must match one of your registered redirect URIs</div>
            <button id="auth-twitch">Authorize with Twitch</button>
            <div id="auth-status" class="status hidden"></div>
        </div>
        
        <p class="hint">Press H to toggle this panel</p>
    </div>
    
    <div id="game-container">
        <div class="floor"></div>
    </div>

    <script>
        // Configuration
        let config = {
            channelName: '',
            clientId: '',
            accessToken: '',
            maxBunnies: 30,
            moveSpeed: 1.5,
            hopProbability: 0.01, // Chance of hopping each frame
            refreshInterval: 15000, // How often to refresh viewer list (15 seconds)
            bunnyScale: {
                viewer: { width: 60, height: 60 },
                streamer: { width: 60, height: 60 }, // Changed from 80x80
                mod: { width: 60, height: 60 },      // Changed from 70x70
                vip: { width: 60, height: 60 }       // Changed from 65x65
            }
        };

        // Try to load saved config
        try {
            const savedConfig = localStorage.getItem('bunnyViewerConfig');
            if (savedConfig) {
                const parsedConfig = JSON.parse(savedConfig);
                config = {...config, ...parsedConfig};
                document.getElementById('channel-name').value = config.channelName || '';
                document.getElementById('client-id').value = config.clientId || '';
                document.getElementById('auth-client-id').value = config.clientId || '';
                
                // Set the redirect URI to the current page by default
                const currentUrl = window.location.href.split('#')[0]; // Remove any hash
                document.getElementById('redirect-uri').value = currentUrl;
                
                // Check for access token in URL (after Twitch redirect)
                checkForAccessToken();
            } else {
                // Set the redirect URI to the current page by default
                const currentUrl = window.location.href.split('#')[0]; // Remove any hash
                document.getElementById('redirect-uri').value = currentUrl;
            }
        } catch (e) {
            console.error("Error loading config:", e);
            // Set the redirect URI to the current page by default
            const currentUrl = window.location.href.split('#')[0]; // Remove any hash
            document.getElementById('redirect-uri').value = currentUrl;
        }
        
        // Bunny sprites - Using actual sprites from the Sprites folder
        const bunnyTypes = [
            'BlackWhite', 'Brown2Color', 'BrownWhite', 'BunnyBlack', 
            'BunnyBrown', 'DemonicBunny', 'FantasyBunny', 'GreyBunny', 
            'LightBrown', 'WhiteBunny'
        ];

        // Update your bunnySprites object to use .gif instead of .png
        const bunnySprites = {
            viewer: {
                idle: bunnyTypes.map(type => `Sprites/${type}/Idle.gif`),
                running: bunnyTypes.map(type => `Sprites/${type}/Running.gif`)
            },
            streamer: {
                idle: 'Sprites/FantasyBunny/Idle.gif',
                running: 'Sprites/FantasyBunny/Running.gif'
            },
            mod: {
                idle: 'Sprites/Brown2Color/Idle.gif',
                running: 'Sprites/Brown2Color/Running.gif'
            },
            vip: {
                idle: 'Sprites/WhiteBunny/Idle.gif',
                running: 'Sprites/WhiteBunny/Running.gif'
            }
        };
        
        // Store active bunnies
        const bunnies = {};
        
        // Store active viewers to detect who left
        let activeViewers = new Set();
        
        // ID for the broadcaster (channel owner)
        let broadcasterId = null;
        
        // Track connection status
        let isConnected = false;
        
        // Store interval IDs for cleanup
        let refreshInterval = null;
        let movementInterval = null;
        
        // Setup tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                // Deactivate all tabs and content
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                // Activate clicked tab
                tab.classList.add('active');
                const tabName = tab.getAttribute('data-tab');
                document.getElementById(`${tabName}-tab`).classList.add('active');
            });
        });
        
        // DOM References
        const gameContainer = document.getElementById('game-container');
        const configOverlay = document.getElementById('config-overlay');
        const saveConfigBtn = document.getElementById('save-config');
        const statusMessage = document.getElementById('status-message');
        const authTwitchBtn = document.getElementById('auth-twitch');
        const authStatus = document.getElementById('auth-status');
        const tokenStatusDisplay = document.getElementById('token-status-display');
        
        // Check for access token in URL (from Twitch redirect)
        function checkForAccessToken() {
            const hash = window.location.hash;
            if (hash) {
                const params = new URLSearchParams(hash.substring(1)); // Remove the # character
                const accessToken = params.get('access_token');
                
                if (accessToken) {
                    // Store the token
                    config.accessToken = accessToken;
                    
                    // Update the UI to show the token is set
                    showTokenStatus('Access token received from Twitch!', 'success');
                    
                    // Clean the URL by removing the hash
                    if (history.replaceState) {
                        history.replaceState(null, null, window.location.pathname + window.location.search);
                    } else {
                        window.location.hash = '';
                    }
                    
                    // Save the token (make sure channelName and clientId are also saved)
                    if (config.channelName && config.clientId) {
                        localStorage.setItem('bunnyViewerConfig', JSON.stringify({
                            channelName: config.channelName,
                            clientId: config.clientId,
                            accessToken: config.accessToken
                        }));
                    }
                    
                    // Initialize the app if we have all necessary configs
                    if (config.channelName && config.clientId) {
                        configOverlay.classList.add('hidden');
                        initializeApp();
                    }
                }
            }
        }
        
        // Authorize with Twitch using Implicit Grant Flow
        authTwitchBtn.addEventListener('click', () => {
            const clientId = document.getElementById('auth-client-id').value.trim();
            const redirectUri = document.getElementById('redirect-uri').value.trim();
            
            if (!clientId || !redirectUri) {
                showAuthStatus('Please enter Client ID and Redirect URI', 'error');
                return;
            }
            
            // Save the client ID to config
            config.clientId = clientId;
            document.getElementById('client-id').value = clientId;
            
            // Update the authentication status
            showAuthStatus('Redirecting to Twitch...', 'loading');
            
            // Construct the Twitch authorization URL
            const scopes = 'moderator:read:chatters channel:read:vips moderation:read';
            const authUrl = `https://id.twitch.tv/oauth2/authorize?client_id=${clientId}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=token&scope=${encodeURIComponent(scopes)}`;
            
            // Save current settings before redirect
            if (document.getElementById('channel-name').value.trim()) {
                config.channelName = document.getElementById('channel-name').value.trim();
                localStorage.setItem('bunnyViewerConfig', JSON.stringify({
                    channelName: config.channelName,
                    clientId: config.clientId
                    // access token will be added after redirect
                }));
            }
            
            // Redirect to Twitch authorization page
            window.location.href = authUrl;
        });
        
        // Save configuration
        saveConfigBtn.addEventListener('click', () => {
            const channelName = document.getElementById('channel-name').value.trim();
            const clientId = document.getElementById('client-id').value.trim();
            
            if (!channelName || !clientId) {
                showStatus('Please enter Channel Name and Client ID', 'error');
                return;
            }
            
            if (!config.accessToken) {
                showStatus('Please authorize with Twitch first in the Authentication tab', 'error');
                document.querySelector('.tab[data-tab="auth"]').click();
                return;
            }
            
            config.channelName = channelName;
            config.clientId = clientId;
            
            localStorage.setItem('bunnyViewerConfig', JSON.stringify({
                channelName: config.channelName,
                clientId: config.clientId,
                accessToken: config.accessToken
            }));
            
            // Hide config after saving
            configOverlay.classList.add('hidden');
            
            // Initialize the app
            initializeApp();
        });
        
        // Show status message in the config tab
        function showStatus(message, type = 'success') {
            statusMessage.textContent = message;
            statusMessage.className = 'status';
            statusMessage.classList.add(`status-${type}`);
            statusMessage.classList.remove('hidden');
            
            // Auto-hide after 5 seconds
            setTimeout(() => {
                statusMessage.classList.add('hidden');
            }, 5000);
        }
        
        // Show status message in the auth tab
        function showAuthStatus(message, type = 'success') {
            authStatus.textContent = message;
            authStatus.className = 'status';
            authStatus.classList.add(`status-${type}`);
            authStatus.classList.remove('hidden');
            
            if (type !== 'loading') {
                // Auto-hide after 5 seconds
                setTimeout(() => {
                    authStatus.classList.add('hidden');
                }, 5000);
            }
        }
        
        // Show token status in config tab
        function showTokenStatus(message, type = 'success') {
            tokenStatusDisplay.textContent = message;
            tokenStatusDisplay.className = 'status';
            tokenStatusDisplay.classList.add(`status-${type}`);
            tokenStatusDisplay.classList.remove('hidden');
        }
        
        // Toggle config panel with H key
        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'h') {
                configOverlay.classList.toggle('hidden');
            }
        });
        
        // Initialize the application when configuration is ready
        function initializeApp() {
            if (!config.channelName || !config.clientId || !config.accessToken) {
                return; // Wait for configuration
            }
            
            // Clean up any existing intervals
            if (refreshInterval) clearInterval(refreshInterval);
            if (movementInterval) clearInterval(movementInterval);
            
            // Get broadcaster ID first
            getBroadcasterId()
                .then(() => {
                    // Start fetching viewers
                    fetchViewers();
                    
                    // Set up intervals for refreshing viewers and updating bunny positions
                    refreshInterval = setInterval(fetchViewers, config.refreshInterval);
                    movementInterval = setInterval(updateBunnies, 50);
                    
                    // Connect to chat for real-time interactions
                    connectToTwitchChat();
                })
                .catch(error => {
                    showStatus(`Error: ${error.message}`, 'error');
                    console.error('Initialization error:', error);
                    
                    // If it's an authorization error, clear the token and ask to reauthorize
                    if (error.message.includes('401') || error.message.includes('auth')) {
                        config.accessToken = '';
                        localStorage.setItem('bunnyViewerConfig', JSON.stringify({
                            channelName: config.channelName,
                            clientId: config.clientId,
                            accessToken: ''
                        }));
                        
                        showStatus('Authentication error. Please reauthorize with Twitch.', 'error');
                        configOverlay.classList.remove('hidden');
                        document.querySelector('.tab[data-tab="auth"]').click();
                    }
                });
        }
        
        // Get the broadcaster ID (needed for API calls)
        async function getBroadcasterId() {
            try {
                const response = await fetch(`https://api.twitch.tv/helix/users?login=${config.channelName}`, {
                    headers: {
                        'Client-ID': config.clientId,
                        'Authorization': `Bearer ${config.accessToken}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.data && data.data.length > 0) {
                    broadcasterId = data.data[0].id;
                    // Also add the broadcaster as a special bunny
                    addBunny(data.data[0].display_name || config.channelName, 'streamer', data.data[0].id);
                } else {
                    throw new Error('Could not find channel');
                }
            } catch (error) {
                console.error('Error getting broadcaster ID:', error);
                throw error;
            }
        }
        
        // Update fetchViewers to support a moderator account that isn't the broadcaster
        async function fetchViewers() {
            if (!broadcasterId) {
                console.error('No broadcaster ID available');
                return;
            }
            
            try {
                // Get user ID of the authorized user (the moderator)
                if (!config.userId) {
                    // First, get the authorized user's ID
                    const userResponse = await fetch('https://api.twitch.tv/helix/users', {
                        headers: {
                            'Client-ID': config.clientId,
                            'Authorization': `Bearer ${config.accessToken}`
                        }
                    });
                    
                    if (!userResponse.ok) {
                        throw new Error(`API Error: ${userResponse.status}`);
                    }
                    
                    const userData = await userResponse.json();
                    if (userData.data && userData.data.length > 0) {
                        config.userId = userData.data[0].id;
                        config.userLogin = userData.data[0].login;
                        
                        // Save to localStorage
                        localStorage.setItem('bunnyViewerConfig', JSON.stringify({
                            channelName: config.channelName,
                            clientId: config.clientId,
                            accessToken: config.accessToken,
                            userId: config.userId,
                            userLogin: config.userLogin
                        }));
                        
                        // Add the logged-in moderator as a bunny too if they're not the broadcaster
                        if (config.userId !== broadcasterId) {
                            addBunny(userData.data[0].display_name, 'mod', config.userId);
                        }
                    } else {
                        throw new Error('Could not get user information');
                    }
                }
                
                // Check if user has moderator permission for the channel
                // Use this user's ID as the moderator_id
                const moderatorId = config.userId;
                
                // Fetch the viewers
                const response = await fetch(`https://api.twitch.tv/helix/chat/chatters?broadcaster_id=${broadcasterId}&moderator_id=${moderatorId}`, {
                    headers: {
                        'Client-ID': config.clientId,
                        'Authorization': `Bearer ${config.accessToken}`
                    }
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    console.error('API error details:', errorData);
                    throw new Error(`API Error: ${response.status}`);
                }
                
                const data = await response.json();
                const currentViewers = new Set();
                
                // Process viewers data
                if (data.data) {
                    data.data.forEach(viewer => {
                        const username = viewer.user_name;
                        const userId = viewer.user_id;
                        currentViewers.add(username.toLowerCase());
                        
                        // Determine viewer type based on badges
                        let viewerType = 'viewer';
                        
                        if (userId === broadcasterId) {
                            viewerType = 'streamer';
                        } else if (userId === config.userId) {
                            viewerType = 'mod'; // The logged-in moderator
                        }
                        
                        // Add or update bunny
                        addBunny(username, viewerType, userId);
                    });
                    
                    // If connection was previously unsuccessful, show success message
                    if (!isConnected) {
                        showStatus('Connected to Twitch successfully!');
                        isConnected = true;
                    }
                }
                
                // Check for VIPs and moderators separately
                await fetchVIPs(currentViewers);
                await fetchModerators(currentViewers);
                
                // Remove bunnies for viewers who left
                removeInactiveViewers(currentViewers);
                
                // Update our active viewers list
                activeViewers = currentViewers;
                
            } catch (error) {
                console.error('Error fetching viewers:', error);
                showStatus(`Error fetching viewers: ${error.message}`, 'error');
                isConnected = false;
                
                // If it's an authorization error, prompt to reauthorize
                if (error.message.includes('401')) {
                    config.accessToken = '';
                    localStorage.setItem('bunnyViewerConfig', JSON.stringify({
                        channelName: config.channelName,
                        clientId: config.clientId,
                        accessToken: ''
                    }));
                    
                    showStatus('Authentication error. Please reauthorize with Twitch.', 'error');
                    configOverlay.classList.remove('hidden');
                    document.querySelector('.tab[data-tab="auth"]').click();
                }
            }
        }

        // Add these helper functions to fetch moderators and VIPs

        async function fetchModerators(currentViewers) {
            try {
                const response = await fetch(`https://api.twitch.tv/helix/moderation/moderators?broadcaster_id=${broadcasterId}`, {
                    headers: {
                        'Client-ID': config.clientId,
                        'Authorization': `Bearer ${config.accessToken}`
                    }
                });
                
                if (!response.ok) {
                    console.error('Error fetching moderators:', response.status);
                    return;
                }
                
                const data = await response.json();
                
                if (data.data) {
                    data.data.forEach(mod => {
                        const username = mod.user_name;
                        const userId = mod.user_id;
                        
                        // Skip if this is the broadcaster (who is also a mod)
                        if (userId === broadcasterId) return;
                        
                        // Update the bunny to mod type
                        updateBunnyType(username.toLowerCase(), 'mod');
                    });
                }
            } catch (error) {
                console.error('Error fetching moderators:', error);
            }
        }

        async function fetchVIPs(currentViewers) {
            try {
                const response = await fetch(`https://api.twitch.tv/helix/channels/vips?broadcaster_id=${broadcasterId}`, {
                    headers: {
                        'Client-ID': config.clientId,
                        'Authorization': `Bearer ${config.accessToken}`
                    }
                });
                
                if (!response.ok) {
                    console.error('Error fetching VIPs:', response.status);
                    return;
                }
                
                const data = await response.json();
                
                if (data.data) {
                    data.data.forEach(vip => {
                        const username = vip.user_name;
                        const userId = vip.user_id;
                        
                        // Update the bunny to VIP type
                        updateBunnyType(username.toLowerCase(), 'vip');
                    });
                }
            } catch (error) {
                console.error('Error fetching VIPs:', error);
            }
        }
        
        // Connect to Twitch chat for real-time updates (user actions, emotes, etc.)
        function connectToTwitchChat() {
            const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
            
            ws.onopen = () => {
                console.log('Connected to Twitch chat');
                
                // Anonymous connection for just listening
                ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands twitch.tv/membership');
                ws.send('PASS SCHMOOPIIE');
                ws.send('NICK justinfan' + Math.floor(Math.random() * 100000));
                ws.send(`JOIN #${config.channelName.toLowerCase()}`);
            };
            
            ws.onmessage = (event) => {
                const message = event.data;
                
                // Handle PING to keep the connection alive
                if (message.startsWith('PING')) {
                    ws.send('PONG :tmi.twitch.tv');
                    return;
                }
                
                // Parse and process chat messages for interaction
                handleChatMessage(message);
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket Error:', error);
            };
            
            ws.onclose = () => {
                console.log('Disconnected from Twitch chat');
                // Try to reconnect after a delay
                setTimeout(connectToTwitchChat, 5000);
            };
        }
        
        // Handle chat messages to make bunnies interact
        function handleChatMessage(message) {
            // PRIVMSG format with tags
            if (message.includes(' PRIVMSG ')) {
                // Extract user details from tags
                const userMatch = message.match(/:([^!]+)!/);
                if (userMatch && userMatch[1]) {
                    const username = userMatch[1];
                    
                    // If they have a bunny, make it hop when they chat
                    if (bunnies[username.toLowerCase()]) {
                        makeBunnyHop(username.toLowerCase());
                    }
                    
                    // Check for badges to update bunny types
                    if (message.includes('badges=')) {
                        const badgesMatch = message.match(/badges=([^;]*)/);
                        if (badgesMatch && badgesMatch[1]) {
                            const badges = badgesMatch[1];
                            
                            // Check for broadcaster/mod/vip badges
                            if (badges.includes('broadcaster')) {
                                updateBunnyType(username.toLowerCase(), 'streamer');
                            } else if (badges.includes('moderator')) {
                                updateBunnyType(username.toLowerCase(), 'mod');
                            } else if (badges.includes('vip')) {
                                updateBunnyType(username.toLowerCase(), 'vip');
                            }
                        }
                    }
                }
            }
        }
        
        // Update bunny type (for moderators, VIPs, etc.)
        function updateBunnyType(username, newType) {
            if (bunnies[username]) {
                // Only upgrade types, never downgrade
                if ((newType === 'streamer' && bunnies[username].type !== 'streamer') ||
                    (newType === 'mod' && bunnies[username].type !== 'streamer' && bunnies[username].type !== 'mod') ||
                    (newType === 'vip' && bunnies[username].type === 'viewer')) {
                    
                    bunnies[username].type = newType;
                    updateBunnyAppearance(username);
                }
            }
        }
        
        // Remove inactive viewers
        function removeInactiveViewers(currentViewers) {
            Object.keys(bunnies).forEach(username => {
                // Don't remove the streamer
                if (bunnies[username].type === 'streamer') return;
                
                // If viewer is no longer in the list, remove their bunny
                if (!currentViewers.has(username.toLowerCase())) {
                    removeBunny(username);
                }
            });
        }
        
        // Update the addBunny function to ensure initial direction is correct
        function addBunny(username, type = 'viewer', userId = null) {
            // Normalize username for comparison
            const normalizedUsername = username.toLowerCase();
            
            // If the bunny already exists, just update its type if needed
            if (bunnies[normalizedUsername]) {
                // Only upgrade viewer types, never downgrade
                if ((type === 'streamer' && bunnies[normalizedUsername].type !== 'streamer') ||
                    (type === 'mod' && bunnies[normalizedUsername].type !== 'streamer' && bunnies[normalizedUsername].type !== 'mod') ||
                    (type === 'vip' && bunnies[normalizedUsername].type === 'viewer')) {
                    
                    bunnies[normalizedUsername].type = type;
                    updateBunnyAppearance(normalizedUsername);
                }
                return;
            }
            
            // Limit the number of bunnies (but always show the streamer)
            if (Object.keys(bunnies).length >= config.maxBunnies && type === 'viewer') return;
            
            // Create the bunny element
            const bunnyElement = document.createElement('div');
            bunnyElement.className = 'bunny';
            
            // Add specific class based on type
            if (type === 'streamer') bunnyElement.classList.add('streamer-bunny');
            if (type === 'mod') bunnyElement.classList.add('mod-bunny');
            if (type === 'vip') bunnyElement.classList.add('vip-bunny');
            
            // Set random position along the floor
            const containerWidth = gameContainer.offsetWidth;
            const x = Math.random() * containerWidth;
            
            // Determine random sprite variant for viewer
            const spriteVariant = Math.floor(Math.random() * bunnySprites.viewer.idle.length);
            
            // Choose sprite based on type
            let idleSprite, runningSprite;
            if (type === 'streamer') {
                idleSprite = bunnySprites.streamer.idle;
                runningSprite = bunnySprites.streamer.running;
            } else if (type === 'mod') {
                idleSprite = bunnySprites.mod.idle;
                runningSprite = bunnySprites.mod.running;
            } else if (type === 'vip') {
                idleSprite = bunnySprites.vip.idle;
                runningSprite = bunnySprites.vip.running;
            } else {
                idleSprite = bunnySprites.viewer.idle[spriteVariant];
                runningSprite = bunnySprites.viewer.running[spriteVariant];
            }
            
            // Initially use idle sprite with animation
            bunnyElement.style.backgroundImage = `url('${idleSprite}')`;
            
            // Add name label
            const nameElement = document.createElement('div');
            nameElement.className = 'bunny-name';
            nameElement.textContent = username;
            bunnyElement.appendChild(nameElement);
            
            gameContainer.appendChild(bunnyElement);
            
            // Determine dimensions based on type
            const bunnyWidth = config.bunnyScale[type].width;
            const bunnyHeight = config.bunnyScale[type].height;
            
            // Choose random initial direction
            const initialDirection = Math.random() > 0.5 ? 'right' : 'left';
            
            // Store bunny data
            bunnies[normalizedUsername] = {
                element: bunnyElement,
                x: x,
                targetX: x + (initialDirection === 'right' ? 1 : -1) * (100 + Math.random() * 200), // Match target with direction
                type: type,
                direction: initialDirection,
                isHopping: false,
                lastHop: 0,
                userId: userId,
                width: bunnyWidth,
                height: bunnyHeight,
                isMoving: false,
                spriteVariant: spriteVariant,
                sprites: {
                    idle: idleSprite,
                    running: runningSprite
                },
                animationState: 'idle'  // Track current animation
            };
            
            // Apply size
            bunnyElement.style.width = `${bunnyWidth}px`;
            bunnyElement.style.height = `${bunnyHeight}px`;
            
            // Apply initial direction
            updateBunnyDirection(normalizedUsername);
        }
        
        // Remove a bunny
        function removeBunny(username) {
            const normalizedUsername = username.toLowerCase();
            if (!bunnies[normalizedUsername]) return;
            
            if (bunnies[normalizedUsername].element) {
                gameContainer.removeChild(bunnies[normalizedUsername].element);
            }
            
            delete bunnies[normalizedUsername];
        }
        
        // Update the makeBunnyHop function to properly handle animations
        function makeBunnyHop(username) {
            const normalizedUsername = username.toLowerCase();
            if (!bunnies[normalizedUsername] || bunnies[normalizedUsername].isHopping) return;
            
            const bunny = bunnies[normalizedUsername];
            const now = Date.now();
            
            // Don't allow hopping too frequently
            if (now - bunny.lastHop < 2000) return;
            
            bunny.isHopping = true;
            bunny.lastHop = now;
            
            // Store previous movement state
            const wasMoving = bunny.isMoving;
            
            // Add hopping class for animation
            bunny.element.classList.add('bunny-hopping');
            
            // Reset after animation completes
            setTimeout(() => {
                if (bunnies[normalizedUsername]) {
                    bunnies[normalizedUsername].isHopping = false;
                    bunnies[normalizedUsername].element.classList.remove('bunny-hopping');
                    
                    // Restore animation state
                    if (wasMoving && !bunnies[normalizedUsername].pauseMovement) {
                        bunnies[normalizedUsername].isMoving = true;
                        updateBunnyAnimation(normalizedUsername, 'running');
                    } else {
                        updateBunnyAnimation(normalizedUsername, 'idle');
                    }
                }
            }, 500);
        }
        
        // Update the updateBunnyDirection function to ensure consistent movement
        function updateBunnyDirection(username) {
            const normalizedUsername = username.toLowerCase();
            if (!bunnies[normalizedUsername]) return;
            
            const bunny = bunnies[normalizedUsername];
            
            // Apply the direction to the bunny element
            if (bunny.direction === 'left') {
                bunny.element.style.transform = 'scaleX(-1)';
                // Make sure name doesn't flip
                const nameElement = bunny.element.querySelector('.bunny-name');
                if (nameElement) {
                    nameElement.style.transform = 'translateX(-50%) scaleX(-1)';
                }
                
                // Ensure target is to the left of current position
                if (bunny.targetX > bunny.x) {
                    bunny.targetX = bunny.x - (100 + Math.random() * 200);
                    // Keep within bounds
                    if (bunny.targetX < 0) bunny.targetX = 0;
                }
            } else {
                bunny.element.style.transform = 'scaleX(1)';
                // Reset name transform
                const nameElement = bunny.element.querySelector('.bunny-name');
                if (nameElement) {
                    nameElement.style.transform = 'translateX(-50%)';
                }
                
                // Ensure target is to the right of current position
                if (bunny.targetX < bunny.x) {
                    const containerWidth = gameContainer.offsetWidth;
                    bunny.targetX = bunny.x + (100 + Math.random() * 200);
                    // Keep within bounds
                    if (bunny.targetX > containerWidth - bunny.width) bunny.targetX = containerWidth - bunny.width;
                }
            }
        }
        
        // Update bunny animation state (simplified for GIFs)
        function updateBunnyAnimation(username, state) {
            const normalizedUsername = username.toLowerCase();
            if (!bunnies[normalizedUsername]) return;
            
            const bunny = bunnies[normalizedUsername];
            
            // Skip if animation state hasn't changed
            if (bunny.animationState === state) return;
            
            // Update animation state
            bunny.animationState = state;
            
            // Set the correct GIF - no need for CSS animation classes
            bunny.element.style.backgroundImage = `url('${bunny.sprites[state]}')`;
        }
        
        // Update all bunny positions
        function updateBunnies() {
            const containerWidth = gameContainer.offsetWidth;
            
            Object.keys(bunnies).forEach(username => {
                const bunny = bunnies[username];
                
                // Skip if currently hopping
                if (bunny.isHopping) return;
                
                // Check if bunny needs a new target
                const distanceToTarget = Math.abs(bunny.targetX - bunny.x);
                if (distanceToTarget < 5) {
                    // Set new target in the same direction first
                    const direction = bunny.direction === 'right' ? 1 : -1;
                    let newTargetX = bunny.x + direction * (100 + Math.random() * 200);
                    
                    // If going off screen, change direction
                    if (newTargetX < 0 || newTargetX > containerWidth - bunny.width) {
                        bunny.direction = bunny.direction === 'right' ? 'left' : 'right';
                        newTargetX = bunny.x + (bunny.direction === 'right' ? 1 : -1) * (100 + Math.random() * 200);
                    }
                    
                    // Randomly change direction sometimes
                    if (Math.random() < 0.3) {
                        bunny.direction = bunny.direction === 'right' ? 'left' : 'right';
                        newTargetX = bunny.x + (bunny.direction === 'right' ? 1 : -1) * (100 + Math.random() * 200);
                    }
                    
                    // Keep within bounds
                    newTargetX = Math.max(0, Math.min(containerWidth - bunny.width, newTargetX));
                    bunny.targetX = newTargetX;
                    
                    // Update visuals for direction
                    updateBunnyDirection(username);
                    
                    // Add a pause between movements (looks more natural)
                    bunny.pauseMovement = true;
                    
                    // Switch to idle animation
                    bunny.isMoving = false;
                    updateBunnyAnimation(username, 'idle');
                    
                    setTimeout(() => {
                        if (bunnies[username]) {
                            bunnies[username].pauseMovement = false;
                        }
                    }, 500 + Math.random() * 1000);
                }
                
                // Move toward target if not paused
                if (!bunny.pauseMovement) {
                    const dx = bunny.targetX - bunny.x;
                    const direction = dx > 0 ? 1 : -1;
                    bunny.x += direction * config.moveSpeed;
                    
                    // Ensure bunny stays within container bounds
                    bunny.x = Math.max(0, Math.min(containerWidth - bunny.width, bunny.x));
                    
                    // Apply position
                    bunny.element.style.left = `${bunny.x}px`;
                    
                    // Set moving state and switch to running animation if not already running
                    if (!bunny.isMoving) {
                        bunny.isMoving = true;
                        updateBunnyAnimation(username, 'running');
                    }
                    
                    // Random hopping
                    if (!bunny.isHopping && Math.random() < config.hopProbability) {
                        makeBunnyHop(username);
                    }
                }
            });
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            const containerWidth = gameContainer.offsetWidth;
            
            // Keep bunnies within bounds
            Object.keys(bunnies).forEach(username => {
                const bunny = bunnies[username];
                if (bunny.x > containerWidth - bunny.width) {
                    bunny.x = containerWidth - bunny.width;
                    bunny.element.style.left = `${bunny.x}px`;
                }
            });
        });
        
        // Initialize if we already have configuration
        if (config.channelName && config.clientId && config.accessToken) {
            configOverlay.classList.add('hidden');
            initializeApp();
        }

        // Test function to generate bunnies without Twitch connection
        function testBunnies() {
            // Clear any existing bunnies
            Object.keys(bunnies).forEach(username => {
                removeBunny(username);
            });
            
            // Add test bunnies with different roles
            const testUsers = [
                { username: 'TestStreamer', type: 'streamer' },
                { username: 'TestModerator', type: 'mod' },
                { username: 'TestVIP', type: 'vip' },
                { username: 'TestViewer1', type: 'viewer' },
                { username: 'TestViewer2', type: 'viewer' },
                { username: 'TestViewer3', type: 'viewer' }
            ];
            
            // Add test bunnies
            testUsers.forEach(user => {
                addBunny(user.username, user.type);
            });
            
            // Start bunny movement
            if (movementInterval) clearInterval(movementInterval);
            movementInterval = setInterval(updateBunnies, 50);
            
            // Add a test button to make bunnies hop
            const testHopButton = document.createElement('button');
            testHopButton.textContent = 'Make Bunnies Hop';
            testHopButton.style.position = 'absolute';
            testHopButton.style.top = '10px';
            testHopButton.style.right = '10px';
            testHopButton.style.zIndex = '1000';
            testHopButton.style.backgroundColor = '#9147ff';
            testHopButton.style.color = 'white';
            testHopButton.style.padding = '10px';
            testHopButton.style.border = 'none';
            testHopButton.style.borderRadius = '4px';
            testHopButton.style.cursor = 'pointer';
            
            testHopButton.addEventListener('click', () => {
                Object.keys(bunnies).forEach(username => {
                    makeBunnyHop(username);
                });
            });
            
            gameContainer.appendChild(testHopButton);
            
            // Make floor visible if it's not already
            let floor = document.querySelector('.floor');
            if (!floor) {
                floor = document.createElement('div');
                floor.className = 'floor';
                gameContainer.appendChild(floor);
            }
        }

        // Add a test button in the config panel
        const testSection = document.createElement('div');
        testSection.className = 'section';
        testSection.innerHTML = `
            <h3>Testing</h3>
            <p>Test the bunny animations without connecting to Twitch:</p>
            <button id="test-bunnies-btn">Generate Test Bunnies</button>
        `;

        configOverlay.appendChild(testSection);

        // Add event listener for the test button
        document.getElementById('test-bunnies-btn').addEventListener('click', () => {
            testBunnies();
            configOverlay.classList.add('hidden');
        });

        // Update the config panel toggle to show it after hiding
        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'h') {
                configOverlay.classList.toggle('hidden');
            }
        });
    </script>
</body>
</html>
